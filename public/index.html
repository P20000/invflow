<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvFlow | Inventory Management System</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Navbar -->
    <header class="navbar">
      <div class="brand">
        <span class="brand-icon">📦</span>
        <div>
          <h1>InvFlow</h1>
          <p class="subtitle">Real-time Inventory Management</p>
        </div>
      </div>
      <div class="nav-actions">
        <span class="status-badge live-pulse">CI/CD Ready</span>
        <button id="openAddModalBtn" class="btn btn-primary">+ Add New Item</button>
      </div>
    </header>

    <!-- Stats Overview -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon icon-blue">📊</div>
        <div class="stat-content">
          <p class="stat-label">Total SKUs</p>
          <h2 id="statTotalItems">-</h2>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-green">📦</div>
        <div class="stat-content">
          <p class="stat-label">Total Units</p>
          <h2 id="statTotalUnits">-</h2>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-amber">⚠️</div>
        <div class="stat-content">
          <p class="stat-label">Low Stock Items</p>
          <h2 id="statLowStock">-</h2>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-purple">💰</div>
        <div class="stat-content">
          <p class="stat-label">Inventory Valuation</p>
          <h2 id="statTotalValue">-</h2>
        </div>
      </div>
    </section>

    <!-- Main Content -->
    <main class="content-card">
      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search item name, SKU, category..." />
        </div>
        <div class="filter-controls">
          <select id="categoryFilter">
            <option value="All">All Categories</option>
          </select>
          <label class="toggle-label">
            <input type="checkbox" id="lowStockToggle" />
            <span>Low Stock Only</span>
          </label>
        </div>
      </div>

      <!-- Inventory Table -->
      <div class="table-responsive">
        <table class="inventory-table">
          <thead>
            <tr>
              <th>SKU</th>
              <th>Item Name</th>
              <th>Category</th>
              <th>Stock Level</th>
              <th>Price</th>
              <th>Status</th>
              <th>Quick Adjust</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody">
            <tr>
              <td colspan="8" class="text-center loading-cell">Loading inventory...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Item Modal (Add / Edit) -->
  <div id="itemModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Inventory Item</h3>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>
      <form id="itemForm">
        <input type="hidden" id="itemId" />
        <div class="form-row">
          <div class="form-group">
            <label for="itemName">Item Name *</label>
            <input type="text" id="itemName" required placeholder="e.g. Wireless Mouse" />
          </div>
          <div class="form-group">
            <label for="itemSku">SKU Code *</label>
            <input type="text" id="itemSku" required placeholder="e.g. TECH-MSE-01" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="itemCategory">Category</label>
            <input type="text" id="itemCategory" placeholder="e.g. Electronics, Office" />
          </div>
          <div class="form-group">
            <label for="itemPrice">Unit Price ($)</label>
            <input type="number" step="0.01" min="0" id="itemPrice" required placeholder="0.00" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="itemQuantity">Quantity in Stock</label>
            <input type="number" min="0" id="itemQuantity" required placeholder="0" />
          </div>
          <div class="form-group">
            <label for="itemThreshold">Low Stock Alert Threshold</label>
            <input type="number" min="0" id="itemThreshold" required placeholder="5" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveItemBtn">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
